# A tag v* runs the checks, then goreleaser (its action, on the runner)
# publishes the archives of every target to the GitHub release and pushes the multi-arch
# image to ghcr.io/<owner>/<repo>.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser: tags and the changelog
      # ffmpeg for all targets takes a while: reuse it until the script changes.
      - uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-all-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - run: make ffmpeg-all
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
