name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command or config, the player, and the container and audio codec of the file if you know them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`adsvc -version`, or the output of `/healthz`."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture and how you run it (binary, Docker)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Use `-log-level debug` if useful. Remove tokens and private URLs.
      render: text
